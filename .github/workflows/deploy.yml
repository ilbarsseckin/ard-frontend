name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package*.json"
      - "next.config.js"
      - "tailwind.config.ts"

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Docker image oluştur ve push et
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ../deploy/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ard-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sunucuya bağlan ve deploy et
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/ard
            docker compose -f deploy/docker-compose.prod.yml pull frontend
            docker compose -f deploy/docker-compose.prod.yml up -d --no-deps frontend
            docker image prune -f
